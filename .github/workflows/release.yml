name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          version="${GITHUB_REF_NAME#v}"
          out="sabokit-${GOOS}-${GOARCH}"
          go build -trimpath -ldflags "-s -w -X github.com/sheyaln/sabokit-cli/internal/cli.Version=${version}" -o "${out}" ./cmd/sabokit
          sha256sum "${out}" > "${out}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: sabokit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            sabokit-${{ matrix.goos }}-${{ matrix.goarch }}
            sabokit-${{ matrix.goos }}-${{ matrix.goarch }}.sha256
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
